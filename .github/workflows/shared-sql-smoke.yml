name: Raahi Shared SQL Smoke

on:
  push:
    branches:
      - raahi-shared-demand-bridge
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/shared-sql-smoke.yml"
  workflow_dispatch:

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed
