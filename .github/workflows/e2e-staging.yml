name: Staging E2E

on:
  workflow_dispatch:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/e2e-staging.yml'
      - 'playwright.staging.config.mjs'
      - 'tests/e2e-staging/**'
      - 'src/app/api/staging-safety/**'

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAAHI_STAGING_URL: ${{ vars.RAAHI_STAGING_URL }}
      RAAHI_TEST_PASSWORD: ${{ secrets.RAAHI_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging target
        shell: bash
        run: |
          if [ -z "$RAAHI_STAGING_URL" ]; then
            echo "RAAHI_STAGING_URL repository variable is required. Refusing to use a fallback target."
            exit 1
          fi
          case "$RAAHI_STAGING_URL" in
            https://*) ;;
            *) echo "RAAHI_STAGING_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Verify isolated V2 backend
        shell: bash
        run: |
          SAFETY_URL="${RAAHI_STAGING_URL%/}/api/staging-safety"
          SAFETY_JSON="$(curl --fail --silent --show-error "$SAFETY_URL")"
          node -e "const p=JSON.parse(process.argv[1]); const expected='euqonxznewasaymdzach'; if(p.safe!==true || p.environment!=='staging' || p.supabaseProjectRef!==expected){console.error('Staging backend attestation failed'); process.exit(1)}" "$SAFETY_JSON"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright test package
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging E2E
        run: npx playwright test --config=playwright.staging.config.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
